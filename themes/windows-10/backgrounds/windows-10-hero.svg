<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <radialGradient id="bg" cx="72%" cy="48%" r="85%">
      <stop offset="0%" stop-color="#0d6cbb"/>
      <stop offset="28%" stop-color="#07529a"/>
      <stop offset="58%" stop-color="#043768"/>
      <stop offset="82%" stop-color="#021d3e"/>
      <stop offset="100%" stop-color="#010d20"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fd8ff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#8fd8ff" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#8fd8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paneLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c8fe0" stop-opacity="0.62"/>
      <stop offset="55%" stop-color="#0d6fc2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#084f96" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="paneRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f8ff" stop-opacity="0.88"/>
      <stop offset="45%" stop-color="#8fd8ff" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#1c9ae2" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9fe3ff" stop-opacity="0"/>
      <stop offset="55%" stop-color="#9fe3ff" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#bdefff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="beamWide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#65c8ff" stop-opacity="0"/>
      <stop offset="60%" stop-color="#65c8ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#8fe0ff" stop-opacity="0.11"/>
    </linearGradient>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <radialGradient id="vignette" cx="55%" cy="48%" r="78%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000308" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>

  <!-- soft diagonal haze across the desktop -->
  <g opacity="0.65">
    <polygon points="-300,2100 1200,-120 1420,-120 -140,2260" fill="url(#streak)"/>
    <polygon points="300,2260 2350,-120 2500,-120 650,2260" fill="url(#streak)" opacity="0.7"/>
    <polygon points="1250,2260 3200,-120 3320,-120 1500,2260" fill="url(#streak)" opacity="0.4"/>
  </g>

  <!-- light spilling left from the hero window -->
  <g>
    <polygon points="60,690 2920,500 2920,800 60,950" fill="url(#beamWide)"/>
    <polygon points="0,1030 2900,930 2900,1120 0,1210" fill="url(#beam)"/>
    <polygon points="120,1380 2930,1310 2930,1390 120,1500" fill="url(#beamWide)" opacity="0.75"/>
    <polygon points="2800,520 3830,360 3830,520 2800,760" fill="url(#beam)" opacity="0.5"/>
  </g>

  <!-- hero window, perspective-tilted and glowing -->
  <g transform="translate(2880 1135) rotate(1.2) skewY(-2.2) scale(1.15)">
    <!-- ambient bloom -->
    <g filter="url(#bloom)" opacity="0.55">
      <polygon points="-420,-470 430,-520 430,520 -420,470" fill="#bfeaff"/>
      <rect x="-430" y="-520" width="860" height="1040" fill="#7fd3ff" opacity="0.5"/>
    </g>

    <!-- panes: right column brighter, as though the light passes through -->
    <g>
      <polygon points="-430,-460 0,-492 0,0 -430,-20" fill="url(#paneLeft)"/>
      <polygon points="0,-492 430,-520 430,18 0,0" fill="url(#paneRight)"/>
      <polygon points="-430,-20 0,0 0,492 -430,460" fill="url(#paneLeft)" opacity="0.9"/>
      <polygon points="0,0 430,18 430,520 0,492" fill="url(#paneRight)" opacity="0.96"/>
    </g>

    <!-- white-hot frame and mullions -->
    <g fill="none" stroke="#eafaff" stroke-linecap="round" filter="url(#soft)">
      <polygon points="-430,-460 0,-492 430,-520 430,18 430,520 0,492 -430,460 -430,-20" stroke-width="7" opacity="0.95"/>
      <path d="M0,-492 L0,0 L0,492" stroke-width="8"/>
      <path d="M-430,-20 L0,0 L430,18" stroke-width="6" opacity="0.9"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.85">
      <polygon points="-430,-460 0,-492 430,-520 430,18 430,520 0,492 -430,460 -430,-20" stroke-width="2.5"/>
      <path d="M0,-492 L0,0 L0,492" stroke-width="3"/>
    </g>

    <!-- inner reflection along the right edge -->
    <polygon points="408,-500 430,-520 430,520 408,496" fill="#ffffff" opacity="0.35" filter="url(#soft)"/>
  </g>

  <!-- subtle edge light where the beams leave the window -->
  <g filter="url(#halo)" opacity="0.5">
    <path d="M2490,560 L2920,560" stroke="#bdefff" stroke-width="10"/>
    <path d="M2480,1450 L2920,1430" stroke="#7fd3ff" stroke-width="8"/>
  </g>

  <rect width="3840" height="2160" fill="url(#vignette)"/>
</svg>
